name: photo_plus
description: "A lightning-fast app for cropping, compressing, rotating and scaling multiple photos
 in one go. PhotoPlus is a Flutter project that runs on Android, iOS, Windows and macOS devices. 
 No need to upload your photos, everything happens offline on your device."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_ui: ^1.1.7
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
